[project]
name = "company-data-crawler"
version = "2.0.0"
description = "A pluggable web crawler that extracts firmographic company data (funding, employees, locations, executives, financials) into validated Pydantic models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sajid Shaikh", email = "shaikhsajid11112000@gmail.com" },
]
keywords = ["crawler", "web-crawler", "web-scraping", "b2b", "firmographic", "craft", "crunchbase", "json", "csv", "xlsx", "company-data", "firm-data", "mongodb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "babel>=2.18.0",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "diskcache>=5.6.3",
    "fake-headers>=1.0.2",
    "price-parser>=0.5.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "python-dateutil>=2.9.0.post0",
    "selenium>=4.48.0",
    "seleniumbase>=4.53.7",
    "tldextract>=5.3.2",
]

[project.urls]
Homepage = "https://github.com/shaikhsajid1111/company-data-crawler"
Repository = "https://github.com/shaikhsajid1111/company-data-crawler"
Issues = "https://github.com/shaikhsajid1111/company-data-crawler/issues"

[project.optional-dependencies]
export = [
    "openpyxl>=3.1.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_data_crawler"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
